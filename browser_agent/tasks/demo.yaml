name: demo_page_capture
description: "Simple demo — visit a URL, screenshot it, extract page title"
strategy: single_page

instructions: |
  1. Navigate to the provided URL.
  2. Use screenshot_evidence to capture the page (label: "main_page").
  3. Use mark_checkpoint with name "page_screenshot".
  4. Use record_fields to extract: {"page_title": "<the page title>", "page_url": "<current URL>"}
  5. Use mark_checkpoint with name "fields_extracted".

input_file: "inputs/demo.csv"
input_columns: ["sample_id", "url"]

output_fields:
  - name: page_title
    type: str
    required: true
    description: "The page title"
  - name: page_url
    type: url
    required: true
    description: "The current page URL"

checkpoints:
  - name: page_screenshot
    evidence_type: screenshot
    description: "Screenshot of the page"
    required: true
  - name: fields_extracted
    evidence_type: extraction
    description: "Page title and URL extracted"
    required: true

evidence_types: ["screenshot", "extraction"]
max_steps: 15
timeout_seconds: 180
