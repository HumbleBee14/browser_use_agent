name: github_commit_audit
description: "Audit GitHub commits for authorship and review compliance"
strategy: graph_traversal

instructions: |
  For each commit URL provided:
  1. Navigate to the commit page on GitHub.
  2. Take EXACTLY ONE screenshot of the commit page using screenshot_evidence (label: "commit_page").
     Then immediately call mark_checkpoint with name "commit_page_screenshot".
  3. Extract these fields using record_fields as a single JSON object:
     - commit_hash: the full SHA hash
     - author: the commit author name
     - date: the commit date (use JavaScript evaluate on the page's <relative-time> element if needed)
     - message: the commit message (first line only)
     - files_changed: number of files changed (as integer)
     Then call mark_checkpoint with name "commit_fields_extracted".
  4. Look for a linked Pull Request on the commit page (check the commit message for "Merge pull request #NNN" or look for PR links in the page).
  5. If a PR exists:
     a. Navigate to the PR page.
     b. Take EXACTLY ONE screenshot (label: "pr_review").
     c. Call mark_checkpoint with name "pr_review_screenshot".
     d. Check if the PR was reviewed/approved.
  6. Use record_fields to add: has_pr (true/false), was_reviewed (true/false if PR exists).
  7. Use make_judgment to answer: "Was this commit properly reviewed before merge?"
  8. Call done immediately. Do NOT take additional screenshots or repeat any steps.

  IMPORTANT RULES:
  - Take each screenshot ONCE. Do not retake unless the first attempt failed.
  - Do not repeat field extraction. Extract all fields in a single record_fields call.
  - If the commit page shows a 404 or error, still record what you can (set missing fields to null) and judge as "inconclusive".
  - Finish as fast as possible — do not explore unnecessary pages.

input_file: "inputs/github_commits.csv"
input_columns: ["sample_id", "url"]

output_fields:
  - name: commit_hash
    type: str
    required: true
    description: "Full SHA hash of the commit"
  - name: author
    type: str
    required: true
    description: "Commit author name"
  - name: date
    type: date
    required: true
    description: "Commit date"
  - name: message
    type: str
    required: true
    description: "Commit message (first line)"
  - name: files_changed
    type: int
    required: false
    description: "Number of files changed"
  - name: has_pr
    type: bool
    required: true
    description: "Whether commit has a linked PR"
  - name: was_reviewed
    type: bool
    required: false
    description: "Whether the PR was reviewed/approved"

checkpoints:
  - name: commit_page_screenshot
    evidence_type: screenshot
    description: "Screenshot of the commit detail page"
    required: true
  - name: commit_fields_extracted
    evidence_type: extraction
    description: "All required commit fields extracted"
    required: true
  - name: pr_review_screenshot
    evidence_type: screenshot
    description: "Screenshot of PR review status (if PR exists)"
    required: false

evidence_types: ["screenshot", "extraction", "judgment"]
max_steps: 12
timeout_seconds: 90
max_retries: 1
use_vision: auto
judgment_question: "Was this commit properly reviewed before merge?"
