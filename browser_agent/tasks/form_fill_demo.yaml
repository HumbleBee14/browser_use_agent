name: form_fill_demo
description: "Demo form fill — submit data to httpbin.org and capture the response"
strategy: form_fill

instructions: |
  For each sample:
  1. Navigate to the provided form URL.
  2. Take EXACTLY ONE screenshot of the empty form (label: "empty_form").
     Then call mark_checkpoint with name "empty_form_screenshot".
  3. Fill in the form fields using the data provided in FORM DATA TO FILL below.
     Match each value to the correct form field by label or placeholder text.
  4. Take EXACTLY ONE screenshot of the filled form (label: "filled_form").
     Then call mark_checkpoint with name "filled_form_screenshot".
  5. Submit the form by clicking the submit button.
  6. Take EXACTLY ONE screenshot of the response/result page (label: "submission_result").
     Then call mark_checkpoint with name "submission_result_screenshot".
  7. Use record_fields to extract:
     - form_submitted: true/false (did the form submit successfully?)
     - response_status: the response status or confirmation text shown after submission
  8. Use make_judgment to answer: "Was the form submitted successfully with correct data?"
  9. Call done immediately.

  IMPORTANT: Do NOT repeat screenshots. Fill all fields before submitting.

input_file: "inputs/form_fill_demo.csv"
input_columns: ["sample_id", "url", "customer_name", "telephone", "email"]

output_fields:
  - name: form_submitted
    type: bool
    required: true
    description: "Whether the form was submitted successfully"
  - name: response_status
    type: str
    required: true
    description: "Response text or status after submission"

checkpoints:
  - name: empty_form_screenshot
    evidence_type: screenshot
    description: "Screenshot of the empty form before filling"
    required: true
  - name: filled_form_screenshot
    evidence_type: screenshot
    description: "Screenshot of the filled form before submitting"
    required: true
  - name: submission_result_screenshot
    evidence_type: screenshot
    description: "Screenshot of the response after form submission"
    required: true

evidence_types: ["screenshot", "extraction", "judgment"]
max_steps: 15
timeout_seconds: 90
max_retries: 1
use_vision: auto
judgment_question: "Was the form submitted successfully with correct data?"
