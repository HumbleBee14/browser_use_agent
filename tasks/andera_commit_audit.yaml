name: andera_commit_audit
description: "Full Andera-spec GitHub commit audit: screenshots, checks, CI, Jira links, CSV output"
strategy: graph_traversal

instructions: |
  For each commit URL provided, perform a thorough audit:

  PHASE 1 — COMMIT PAGE
  1. Navigate to the commit page.
  2. Take ONE screenshot of the commit page (label: "commit_page").
     Call mark_checkpoint with name "commit_page_captured".
  3. Extract and record these fields using record_fields:
     - commit_hash: full SHA
     - commit_url: the current page URL
     - pr_creator: who authored the commit/PR
     - commit_date: when it was committed
     - commit_message: first line of commit message
     - files_changed: number of files changed

  PHASE 2 — PULL REQUEST & REVIEWS
  4. Find the linked Pull Request (check commit message for "Merge pull request #NNN" or PR links).
  5. If a PR exists, navigate to it.
     - Take ONE screenshot of the PR page (label: "pr_page").
     - Call mark_checkpoint with name "pr_captured".
     - Extract: pr_approver (who approved), pr_merger (who merged).
  6. If no PR exists, set pr_approver and pr_merger to "N/A".

  PHASE 3 — CHECKS & CI
  7. On the PR or commit page, look for the checks/status section.
  8. Take ONE screenshot of the checks section (label: "checks_status").
     Call mark_checkpoint with name "checks_captured".
  9. Identify:
     - checks_passed: number of checks that passed
     - checks_failed: number of checks that failed (0 if none)
     - failed_check_notes: description of any failed checks (or "none")
  10. If there is a failed CI check, click into it to see details.
      Take ONE screenshot of the CI failure (label: "ci_failure_detail").

  PHASE 4 — JIRA/LINEAR TICKET
  11. Look for any linked Jira or Linear ticket in the PR description, commit message, or branch name.
  12. If a ticket link exists:
      - Navigate to the ticket.
      - Take ONE screenshot (label: "linked_ticket").
      - Call mark_checkpoint with name "ticket_captured".
      - Extract: jira_ticket_link (the URL).
  13. If no ticket link found, set jira_ticket_link to "none".

  PHASE 5 — JUDGMENT & FINISH
  14. Use record_fields to record: pr_approver, pr_merger, checks_passed, checks_failed, failed_check_notes, jira_ticket_link.
  15. Use make_judgment to answer: "Was this commit properly reviewed and all checks passing before merge?"
  16. Call done immediately.

  RULES:
  - Take each screenshot ONCE. Do not repeat.
  - Extract all fields in as few record_fields calls as possible.
  - If a page shows 404, record what you can and move on.
  - Finish as fast as possible.

input_file: "inputs/andera_commits.csv"
input_columns: ["sample_id", "url"]

output_fields:
  - name: commit_hash
    type: str
    required: true
    description: "Full SHA hash"
  - name: commit_url
    type: url
    required: true
    description: "GitHub commit URL"
  - name: pr_creator
    type: str
    required: true
    description: "Who created the PR/commit"
  - name: pr_approver
    type: str
    required: true
    description: "Who approved the PR (N/A if no PR)"
  - name: pr_merger
    type: str
    required: true
    description: "Who merged the PR (N/A if no PR)"
  - name: commit_date
    type: date
    required: true
    description: "Commit date"
  - name: commit_message
    type: str
    required: true
    description: "First line of commit message"
  - name: files_changed
    type: int
    required: false
    description: "Number of files changed"
  - name: checks_passed
    type: int
    required: false
    description: "Number of CI checks that passed"
  - name: checks_failed
    type: int
    required: false
    description: "Number of CI checks that failed"
  - name: failed_check_notes
    type: str
    required: false
    description: "Description of failed checks or 'none'"
  - name: jira_ticket_link
    type: str
    required: false
    description: "Link to Jira/Linear ticket or 'none'"

checkpoints:
  - name: commit_page_captured
    evidence_type: screenshot
    description: "Screenshot of the commit page"
    required: true
  - name: pr_captured
    evidence_type: screenshot
    description: "Screenshot of the PR page (if exists)"
    required: false
  - name: checks_captured
    evidence_type: screenshot
    description: "Screenshot of the checks/CI status"
    required: false
  - name: ticket_captured
    evidence_type: screenshot
    description: "Screenshot of linked Jira/Linear ticket"
    required: false

evidence_types: ["screenshot", "extraction", "judgment"]
max_steps: 20
timeout_seconds: 300
max_retries: 0
use_vision: auto
judgment_question: "Was this commit properly reviewed and all checks passing before merge?"
