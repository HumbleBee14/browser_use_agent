name: andera_ticket_extraction
description: "Screenshot tickets and extract key fields to CSV (Linear/Jira pattern, using GitHub Issues as stand-in)"
strategy: single_page

instructions: |
  For each ticket URL provided:
  1. Navigate to the ticket/issue page.
  2. Take ONE screenshot of the full ticket page (label: "ticket_page").
     Call mark_checkpoint with name "ticket_captured".
  3. Extract these fields using record_fields as a single JSON object:
     - ticket_number: the ticket/issue number
     - title: the ticket title
     - assignee: who is assigned to this ticket (or "unassigned")
     - status: current status (open/closed/in progress/etc.)
     - due_date: the due date if visible (or "none")
     - priority: priority level if visible (or "none")
     - labels: comma-separated labels (or "none")
  4. Call mark_checkpoint with name "ticket_fields_extracted".
  5. Call done immediately.

  RULES:
  - Take each screenshot ONCE.
  - Extract all fields in a single record_fields call.
  - If a field is not visible on the page, set it to "none" or "not visible".

input_file: "inputs/andera_tickets.csv"
input_columns: ["sample_id", "url"]

output_fields:
  - name: ticket_number
    type: int
    required: true
    description: "Ticket/issue number"
  - name: title
    type: str
    required: true
    description: "Ticket title"
  - name: assignee
    type: str
    required: true
    description: "Who is assigned"
  - name: status
    type: str
    required: true
    description: "Current status"
  - name: due_date
    type: str
    required: false
    description: "Due date if visible"
  - name: priority
    type: str
    required: false
    description: "Priority level if visible"
  - name: labels
    type: str
    required: false
    description: "Comma-separated labels"

checkpoints:
  - name: ticket_captured
    evidence_type: screenshot
    description: "Screenshot of the full ticket page"
    required: true
  - name: ticket_fields_extracted
    evidence_type: extraction
    description: "All ticket fields extracted"
    required: true

evidence_types: ["screenshot", "extraction"]
max_steps: 10
timeout_seconds: 60
max_retries: 1
use_vision: auto
