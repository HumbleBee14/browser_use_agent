name: andera_blame_review
description: "Code blame analysis: find file, check blame, assess materiality of recent changes"
strategy: graph_traversal

instructions: |
  For each code file URL provided:

  PHASE 1 — FILE VIEW
  1. Navigate to the file URL on GitHub.
  2. Take ONE screenshot of the file view (label: "file_view").
     Call mark_checkpoint with name "file_view_captured".
  3. Extract: file_path, repository name.

  PHASE 2 — BLAME VIEW
  4. Switch to the Blame view (click the "Blame" button or navigate to the blame URL).
  5. Take ONE screenshot of the blame view (label: "blame_view").
     Call mark_checkpoint with name "blame_view_captured".
  6. Look at the blame annotations to find:
     - last_modified_date: when the most recent change was made to this file
     - last_modified_author: who made the most recent change
     - within_threshold: was the last change within the past year? (true/false)

  PHASE 3 — MATERIALITY ASSESSMENT
  7. If the file was modified within the past year (within_threshold = true):
     a. Click on the most recent commit in the blame view.
     b. Take ONE screenshot of that commit (label: "recent_commit").
     c. Call mark_checkpoint with name "recent_commit_captured".
     d. Look at what was changed. Determine:
        - materially_changed: Could this change have materially affected a calculation or business logic? (yes/no/inconclusive)
        - change_description: Brief description of what was changed.
  8. If the file was NOT modified within the past year:
     - Set materially_changed to "no" and change_description to "No recent changes".

  PHASE 4 — FINISH
  9. Use record_fields to record all extracted fields.
  10. Use make_judgment to answer: "Could recent changes to this code have materially affected calculations?"
  11. Call done.

  RULES:
  - If the file doesn't exist (404), record what you can and judge as "inconclusive".
  - Take each screenshot once. Do not repeat.
  - Consider the year threshold as: changes after 2025-03-27.

input_file: "inputs/andera_blame.csv"
input_columns: ["sample_id", "url"]

output_fields:
  - name: file_path
    type: str
    required: true
    description: "Full file path in the repository"
  - name: last_modified_date
    type: date
    required: true
    description: "Date of most recent change to this file"
  - name: last_modified_author
    type: str
    required: true
    description: "Who made the most recent change"
  - name: within_threshold
    type: bool
    required: true
    description: "Was the last change within the past year?"
  - name: materially_changed
    type: str
    required: true
    description: "yes/no/inconclusive — could the change affect calculations?"
  - name: change_description
    type: str
    required: false
    description: "Brief description of what was changed"

checkpoints:
  - name: file_view_captured
    evidence_type: screenshot
    description: "Screenshot of the file in normal view"
    required: true
  - name: blame_view_captured
    evidence_type: screenshot
    description: "Screenshot of the blame view"
    required: true
  - name: recent_commit_captured
    evidence_type: screenshot
    description: "Screenshot of the recent commit (if within threshold)"
    required: false

evidence_types: ["screenshot", "extraction", "judgment"]
max_steps: 15
timeout_seconds: 120
max_retries: 1
use_vision: auto
judgment_question: "Could recent changes to this code have materially affected calculations?"
